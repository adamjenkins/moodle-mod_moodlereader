name: mod_moodlereader
summary: 'Extensive reading: students read graded readers and take mreader.org book quizzes in Moodle; words in passed books count toward a reading goal.'
description: |
  Moodle Reader is an activity for extensive-reading programmes. Students read
  graded readers at their own level and take a short comprehension quiz on each
  book. The quiz comes from the mreader.org quiz service, which chooses the
  questions and marks the answers; Moodle shows it one question at a time in its
  own pages and never stores the questions. The words in each passed book count
  toward a reading goal and the gradebook, and a book counts once for a student
  across the whole site.

  Students see their progress, reading level, the books they have read, a reading
  report and a book search. Teachers get reports modelled on the original Reader
  module, reading goals and levels, messages, award credit, and cheating detection
  with a school allow-list. Quizzes can require Safe Exam Browser, set by the site
  or the activity, with Moodle's own configuration, a site SEB template, a copy of
  a quiz's configuration, or SEB's own. The site connects to mreader.org with a
  signed API; no student names or ids are ever sent. A repeatable importer brings
  courses across from the original Reader module (mod_reader).

  Needs an approved mreader.org account (mreader.org v3.8 or later). It is a
  rebuild of mod_reader by Gordon Bateson, whose design it follows.
labels:
